[project]
name = "domo-gatekeeper"
version = "0.13.1"
description = "The assistant gatekeeper: encrypted secret vault and provider relay."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anyio>=4.15.1",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "domo-common",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
domo-common = { workspace = true }
