# Alembic configuration for the command line, run from this directory:
#
#   uv run alembic upgrade head
#
# The database is the one CoreSettings points at (DOMO_DATABASE_URL, or the DOMO_DB_*
# settings with the password file). The migrations live inside the package, so that the
# installed core can run them (see domo_core/migrate.py, which does not use this file).

[alembic]
script_location = %(here)s/src/domo_core/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
