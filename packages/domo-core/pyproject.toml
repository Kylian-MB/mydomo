[project]
name = "domo-core"
version = "0.12.0"
description = "The assistant core: web interface, chat, accounts and audit trail."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.13.0",
    "anyio>=4.15.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0,<0.33",
    "babel>=2.18.0",
    "common-expression-language>=0.10.0",
    "fastembed>=0.9.0",
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "httpx2>=2.12",
    "domo-common",
    "jinja2>=3.1.6",
    "openai>=3.29.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.4",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "webauthn>=3.0.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
domo-common = { workspace = true }
