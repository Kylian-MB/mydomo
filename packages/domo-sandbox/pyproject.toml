[project]
name = "domo-sandbox"
version = "0.13.0"
description = "The assistant sandbox: a launcher that runs one tool of the assistant in its own process, with limits."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anyio>=4.15.1",
    "bandit>=1.8.0",
    "fastapi>=0.143.0",
    "domo-common",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
domo-common = { workspace = true }
